[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hansker-linux-fw-unofficial"
version = "0.2.0"
description = "Unofficial Linux firmware updater for the Hansker Performance mouse"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14.0",
    "pyusb>=1.3.1",
]

[project.scripts]
hansker-fw = "hansker_updater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hansker_updater"]
